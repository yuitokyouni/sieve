model_id: example-market-sim
model_version: "2.4.0"
display_name: Example market scenario generator
model_family: econometric
code_uri: https://github.com/yuitokyouni/sieve/tree/main/examples/model_update
git_commit: GIT_COMMIT_PLACEHOLDER
authors:
  - sieve examples
license: MIT
notes: >-
  Candidate version for the model-update regression example: a refit on a
  shortened window shipped two silent consequences — volatility persistence
  collapsed (beta 0.875 -> 0.80, alpha+beta 0.993 -> 0.918) and the
  Student-t degrees of freedom hit the fitter's clip bound (nu 6.47 -> 30).
  omega and alpha are unchanged. 15,000 days, seed 12; regenerate with
  generate.py (git_commit above pins the generator code that produced
  returns.csv).
parameters:
  generator: garch_t
  omega: 0.011039650497380534
  alpha: 0.11756950878547939
  beta: 0.80
  t_df: 30.0
  n: 15000
  seed: 12
